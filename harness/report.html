<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DesktopMark Report</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --best-bg: rgba(42,120,214,0.10);
  --critical: #d03b3b; --band: rgba(11,11,11,0.035); --band-settle: rgba(42,120,214,0.08);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #6250d6; --s7: #e34948;
  --shadow: 0 1px 2px rgba(11,11,11,0.06), 0 8px 24px rgba(11,11,11,0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5; --best-bg: rgba(57,135,229,0.16);
    --band: rgba(255,255,255,0.035); --band-settle: rgba(57,135,229,0.12);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s7: #e66767;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5; --best-bg: rgba(57,135,229,0.16);
  --band: rgba(255,255,255,0.035); --band-settle: rgba(57,135,229,0.12);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s7: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px 80px; }
header.top { padding: 40px 0 28px; display: flex; gap: 24px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 44px; height: 44px; border-radius: 12px; box-shadow: var(--shadow); }
.logo svg { display: block; width: 44px; height: 44px; }
h1 { font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; margin: 0; }
.sub { color: var(--ink-2); margin-top: 4px; font-size: 14px; }
.top-actions { display: flex; gap: 8px; align-items: center; }
button, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover, select:hover { border-color: var(--axis); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 20px; }
.pill { border-radius: 999px; padding: 6px 14px; font-size: 13px; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.versions { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13px; margin: -12px 0 28px; }
.versions b { color: var(--muted); font-weight: 500; }
.filter { position: sticky; top: 0; z-index: 20; background: var(--page); padding: 10px 0 12px; margin: 0 0 16px; border-bottom: 1px solid var(--border); }
@media (max-width: 720px) { .filter { position: static; } }
.stack-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.stack-head b { color: var(--ink); font-weight: 600; }
.stack-head .count { margin-left: auto; font-size: 12px; }
.stack-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 8px; }
@media (max-width: 720px) { .stack-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stack-card { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px 8px 8px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); }
.stack-card .bar { width: 5px; align-self: stretch; border-radius: 3px; flex: none; }
.stack-card .txt { display: grid; min-width: 0; flex: 1; }
.stack-card .nm { font-weight: 600; font-size: 14px; }
.stack-card .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stack-card .tick { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none;
  border: 1.5px solid var(--axis); color: var(--page); }
.stack-card[aria-pressed="true"] { border-color: var(--ink-2); }
.stack-card[aria-pressed="true"] .tick { background: var(--ink); border-color: var(--ink); }
.stack-card[aria-pressed="false"] { border-style: dashed; background: transparent; }
.stack-card[aria-pressed="false"] .nm { color: var(--muted); font-weight: 500; }
.stack-card[aria-pressed="false"] .bar { opacity: 0.25; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 28px; }
.fact { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.fact .k { color: var(--muted); font-size: 12px; }
.fact .v { font-size: 14px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow); }
h2 { font-size: 20px; letter-spacing: -0.01em; margin: 0 0 4px; }
.lede { color: var(--ink-2); margin: 0 0 18px; font-size: 14px; max-width: 75ch; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.swl { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
thead th { font-weight: 600; color: var(--ink-2); font-size: 13px; border-bottom: 1px solid var(--axis); position: sticky; top: 0; background: var(--surface); }
thead th .sw { margin-right: 6px; vertical-align: -1px; }
td { font-variant-numeric: tabular-nums; }
td.best { background: var(--best-bg); font-weight: 700; }
td .subv { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 1px; }
tr.hgroup td { text-align: left; white-space: normal; padding-top: 18px; border-bottom: 1px solid var(--axis); font-size: 12px; color: var(--muted); }
tr.hgroup td b { color: var(--ink); font-size: 14px; font-weight: 700; letter-spacing: 0.01em; }
tr.hgroup:first-child td { padding-top: 8px; }
.about-btn { all: unset; cursor: pointer; display: inline-flex; align-items: baseline; gap: 6px; }
.about-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.about-btn .info { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--axis); color: var(--muted);
  font: italic 600 10px/1 Georgia, serif; flex: none; align-self: center; }
.about-btn:hover .info, .about-btn[aria-expanded="true"] .info { border-color: var(--accent); color: var(--accent); }
.pop { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  padding: 12px 14px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.pop-t { color: var(--ink); font-weight: 600; margin-bottom: 4px; }
td.best .trophy { width: 14px; height: 14px; color: var(--accent); vertical-align: -2px; margin-right: 6px; }
td.fail { color: var(--critical); font-weight: 600; }
td .dir { color: var(--muted); font-size: 11px; margin-left: 4px; font-weight: 400; }
tr.group td { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 16px; border-bottom: none; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 14px; margin-top: 14px; }
.charts { display: grid; gap: 10px; }
.chart { position: relative; }
.chart h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 2px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.multiples { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.multiples.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 24px 32px; }
.tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  border-radius: 10px; padding: 8px 10px; font-size: 12px; z-index: 50; min-width: 150px; display: none; }
.tip .t { color: var(--muted); margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.tip .r b { font-variant-numeric: tabular-nums; font-weight: 600; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.shot { margin: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.shot .thumb { padding: 0; border: 0; border-radius: 0; background: #000; display: block; aspect-ratio: 16 / 7; overflow: hidden; }
.shot .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
.loupe-box { overflow: hidden; border-top: 1px solid var(--border); background: #000; }
.loupe { image-rendering: pixelated; background-repeat: no-repeat; transform-origin: 0 0; }
.shot figcaption { padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; }
.shot .name { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.shot .nums { color: var(--ink-2); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.shot.ref .name { color: var(--muted); }
.walk { width: 100%; display: block; border-radius: 10px; background: #000; aspect-ratio: 16 / 9; }
.rowtitle { font-size: 14px; margin: 18px 0 8px; color: var(--ink); }
.shotset h3 { font-size: 16px; margin: 0 0 2px; }
.shotset p { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; }
.empty { color: var(--muted); font-size: 14px; }
.problems li { color: var(--ink-2); font-size: 13px; margin: 4px 0; overflow-wrap: anywhere; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; flex-direction: column; }
.lightbox.open { display: flex; }
.lb-bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; color: #f0efec; flex-wrap: wrap; }
.lb-bar .title { font-weight: 600; margin-right: auto; }
.lb-bar button { background: #232321; color: #f0efec; border-color: rgba(255,255,255,0.15); }
.lb-bar button[aria-pressed="true"] { background: #f0efec; color: #0b0b0b; }
.lb-stacks { display: flex; flex-wrap: wrap; gap: 6px; }
.lb-nums { color: #c3c2b7; font-weight: 400; margin-left: 8px; font-variant-numeric: tabular-nums; }
.lb-hint { color: #898781; font-size: 12px; padding: 0 16px 8px; }
.lb-img { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: flex-start; padding: 0 16px 16px; }
.lb-img img { image-rendering: pixelated; display: block; }
.gauge-head { display: flex; justify-content: flex-end; margin-bottom: -18px; position: relative; z-index: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; font-size: 12px; padding: 4px 10px; background: var(--surface); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.netbox { margin: 0 0 22px; }
.nethint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.nethint b { color: var(--ink); font-weight: 600; }
.netswitch { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; }
.net { display: grid; gap: 2px; text-align: left; padding: 14px 18px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }
.net .t { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.net .d { color: var(--ink-2); font-size: 13px; }
.net[aria-pressed="true"] { border-color: var(--accent); background: var(--best-bg); }
.net[aria-pressed="true"] .t::after { content: "showing"; margin-left: 10px; vertical-align: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
.flag { color: var(--critical); font-weight: 600; }
td.hand { background: rgba(208,59,59,0.07); font-weight: 700; }
td.hand .was, td.why .was { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.snote { font-size: 13px; border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-2); }
.snote.defect { border-color: var(--critical); }
.snote.defect b { color: var(--critical); }
.flags { font-size: 13px; border: 1px solid var(--critical); border-radius: 10px; padding: 10px 12px; margin: -6px 0 16px; color: var(--ink-2); display: grid; gap: 4px; }
.flags b { color: var(--ink); }
.theme-switch { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; }
.theme-switch .ico { font-size: 14px; color: var(--muted); line-height: 1; }
.theme-switch .track { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--axis); transition: background .15s; }
.theme-switch .knob { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.theme-switch[aria-checked="true"] .track { background: var(--accent); }
.theme-switch[aria-checked="true"] .knob { left: 19px; }
.theme-switch[aria-checked="false"] .sun, .theme-switch[aria-checked="true"] .moon { color: var(--ink); }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.cfg { border-top: 1px solid var(--grid); padding-top: 18px; margin-top: 18px; }
.cfg:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.cfg h3 { font-size: 16px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cfg h3 .ver { color: var(--ink-2); font-weight: 400; font-size: 14px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; margin: 0 0 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
table.set td, table.set th { text-align: left; white-space: normal; vertical-align: top; }
table.set td:nth-child(-n+2) { white-space: nowrap; }
table.set td.why { color: var(--ink-2); font-size: 13px; }
td.over { background: var(--best-bg); font-weight: 700; }
td.over .was { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
pre.cmd { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 8px 0 0; }
.banner { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; margin: -12px 0 28px; font-size: 14px; }
.banner code { background: var(--best-bg); border-radius: 4px; padding: 1px 5px; margin-right: 4px; }
.chart > .zoom-btn { position: absolute; top: -4px; right: 0; padding: 5px; line-height: 0; border-radius: 7px; color: var(--muted); background: var(--surface); }
.chart > .zoom-btn:hover { color: var(--ink); }
.chart > h3 { padding-right: 34px; }
.zoom { position: fixed; inset: 0; z-index: 45; background: var(--page); display: none; flex-direction: column; overflow: auto; }
.zoom.open { display: flex; }
.zoom-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--page); border-bottom: 1px solid var(--border); }
.zoom-bar h2 { margin: 0; flex: 1; }
.zoom-x { font-size: 16px; line-height: 1; padding: 8px 11px; border-radius: 8px; }
.zoom-body { padding: 18px 24px 32px; }
html.zoom-open, html.zoom-open body { overflow: hidden; }
@media (max-width: 640px) { .zoom-bar { padding: 10px 16px; } .zoom-body { padding: 12px 16px 24px; } }
footer { color: var(--muted); font-size: 12px; margin-top: 32px; }
@media (max-width: 640px) { .wrap { padding: 0 16px 60px; } section.card { padding: 16px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44"><defs><linearGradient id="dm-logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#1baf7a"/></linearGradient></defs><rect width="44" height="44" rx="12" fill="url(#dm-logo-g)"/><g transform="translate(22 22) scale(1.6) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7 12l3-3 2 2 4-4"/></g></svg></div>
      <div><h1>DesktopMark</h1><div class="sub" id="sub"></div></div>
    </div>
    <div class="top-actions"><button id="theme" type="button" role="switch" class="theme-switch" aria-label="Dark mode"><span class="ico sun" aria-hidden="true">☀</span><span class="track" aria-hidden="true"><span class="knob"></span></span><span class="ico moon" aria-hidden="true">☾</span></button></div>
  </header>
  <div class="facts" id="facts"></div>
  <div id="preview"></div>
  <div class="pills" id="sections" role="group" aria-label="Section"></div>
  <div class="filter" id="filter" role="group" aria-label="Stacks shown"></div>
  <main id="main"></main>
  <footer>Every measurement is taken in Chromium through each project's own web client. Cells are medians over reps; the timeline, curves and screenshots are from the first rep. Method and fairness rules: <a href="https://desktopmark.selkies.io/">desktopmark.selkies.io</a>.</footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Screenshot">
  <div class="lb-bar"><span class="title"><span id="lb-title"></span> <span class="lb-nums" id="lb-nums"></span></span>
    <span class="lb-stacks" id="lb-stacks" role="group" aria-label="Stack"></span>
    <button type="button" id="lb-zoom" title="Zoom (Z)">1:1</button>
    <button type="button" id="lb-close" aria-label="Close">Close</button></div>
  <div class="lb-hint">← → switch stack · X the X server · Z zoom · Esc close</div>
  <div class="lb-img"><img id="lb-img" alt=""></div>
</div>
<script id="dm-data" type="application/json">__DM_DATA__</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('dm-data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) k === 'class' ? (e.className = v) : k === 'style' ? (e.style.cssText = v) : k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const SVGNS = 'http://www.w3.org/2000/svg';
const s = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const color = (stack) => `var(--s${D.stackOrder.indexOf(stack) + 1})`;
const swatch = (stack, line) => h('span', { class: line ? 'swl' : 'sw', style: `background:${color(stack)}` });
const median = (a) => { const b = [...a].sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; };
const noise = (best, d, rel = 0.01) => Math.max(10 ** -(d ?? 2), Math.abs(best) * rel) + 1e-9;
const fmt = (v, d = 1) => v == null ? '–' : (+v).toFixed(d);

const root = document.documentElement;
const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const syncTheme = () => $('#theme').setAttribute('aria-checked', String(dark()));

        h('span', { class: 'tick', 'aria-hidden': 'true' }, on ? '✓' : ''));
    })));
}
function view(sec) {
  const keep = sec.cols.map((c) => shown.has(c));
  const rows = (rs) => rs.map((r) => {
    const cells = r.cells.filter((_, i) => keep[i]).map((c) => ({ ...c, best: false }));
    const nums = cells.map((c) => c.v).filter((v) => v != null);
    if (r.better && cells.length > 1 && nums.length) { const b = r.better === 'hi' ? Math.max(...nums) : Math.min(...nums); for (const c of cells) if (c.v != null && Math.abs(c.v - b) <= noise(b, r.d, r.rel)) c.best = true; }
    return { ...r, cells };
  }).filter((r) => r.cells.some((c) => c.text));
  return { ...sec, cols: sec.cols.filter((_, i) => keep[i]), headline: rows(sec.headline), cost: rows(sec.cost || []), all: rows(sec.all) };
}

const settingsAt = (c, mode, link) => { const m = c.modes[mode] || Object.values(c.modes)[0] || []; return Array.isArray(m) ? m : m[link] || Object.values(m)[0] || []; };
const sectionFlags = (sec) => (D.config || []).filter((c) => sec.cols.includes(c.col)).map((c) => ({ col: c.col,
  hand: settingsAt(c, sec.mode, sec.link).filter((x) => x.linkSet === sec.link), defects: ((c.notes || {})[sec.link] || []).filter((n) => n.kind === 'defect'),
  merged: (sec.merged || {})[c.col] }))
  .filter((f) => f.hand.length || f.defects.length || f.merged);
function flagBox(sec) {
  const fl = sectionFlags(sec);
  if (!fl.length) return null;
  return h('div', { class: 'flags' }, fl.map((f) => h('div', {}, h('b', {}, '⚑ ', swatch(f.col), ' ', f.col, ': '),
    f.merged ? f.merged.replace(/^./, (c) => c.toUpperCase()) + ' ' : null,
    f.hand.flatMap((x) => [h('code', {}, x.key), ' hand-set to ', h('code', {}, x.value), ` on this link (elsewhere ${x.linkBase}). `]),
    f.defects.map((n) => `Defect: ${n.text.split('. ')[0]}. `), 'Details under Configuration under test.')));
}

const GROUP_LABEL = { server: 'server', client: 'client URL', env: 'environment', pipeline: 'pipeline', x264: 'x264enc' };
function settingsTable(c, list, stack) {
  const t = h('table', { class: 'set' }, h('thead', {}, h('tr', {}, h('th', {}, 'Setting'), h('th', {}, 'Value'), h('th', {}, `${stack} ships`), h('th', {}, 'Why'))));
  const multi = new Set(list.map((x) => x.group)).size > 1;
  t.append(h('tbody', {}, list.map((x) => h('tr', {},
    h('td', {}, multi ? h('span', { class: 'dir', style: 'margin:0 6px 0 0' }, GROUP_LABEL[x.group] || x.group) : null, h('code', { title: `set.${stack}.${multi ? x.group + ':' : ''}${x.key}=…` }, x.key)),
    h('td', { class: x.overridden ? 'over' : x.linkSet ? 'hand' : null }, h('code', {}, x.value ?? 'unset'),
      x.linkSet ? h('span', { class: 'was' }, h('span', { class: 'flag' }, '⚑ hand-set'), ` for ${x.linkSet.toUpperCase()}; elsewhere ${x.linkBase}`) : null,
      x.overridden ? h('span', { class: 'was' }, x.added ? 'added by this run' : `file: ${x.base ?? 'unset'}`) : null),
    h('td', {}, x.ships != null ? h('code', {}, x.ships) : ''),
    h('td', { class: 'why' }, x.why, x.linkSet && x.linkWhy ? h('span', { class: 'was' }, `On ${x.linkSet.toUpperCase()}: ${x.linkWhy}`) : null)))));
  return h('div', { class: 'table-wrap' }, t);
}
function configuration(sec) {
  const cols = (D.config || []).filter((c) => shown.has(c.col));
  if (!cols.length) return null;
  return cols.map((c) => {
    const v = c.versions || {}, list = settingsAt(c, sec.mode, sec.link), notes = (c.notes || {})[sec.link] || [];
    const launchText = typeof c.launchText === 'string' ? c.launchText : (c.launchText || {})[sec.link] || Object.values(c.launchText || {})[0];
    const tuned = list.filter((x) => x.role !== 'harness'), harness = list.filter((x) => x.role === 'harness');
    const kv = [['Source', v.source], ['Binary', v.binary], ['sha256', v.sha256], ['X server', v.xserver], ['x264', v.x264]].filter(([, x]) => x);
    return h('div', { class: 'cfg' },
      h('h3', {}, swatch(c.col), c.col, h('span', { class: 'ver' }, v.version || '')),
      kv.length ? h('dl', { class: 'kv' }, kv.flatMap(([k, x]) => [h('dt', {}, k), h('dd', {}, h('code', {}, x))])) : null,
      notes.map((n) => h('div', { class: `snote ${n.kind}` }, h('b', {}, n.kind === 'defect' ? '⚠ Defect' : 'ℹ Note'), ' ', n.text)),
      tuned.length ? settingsTable(c, tuned, c.stack) : null,
      harness.length ? h('details', {}, h('summary', {}, `Harness settings (${harness.length}): the same for every rep, needed for the test to run`), settingsTable(c, harness, c.stack)) : null,
      launchText ? h('details', {}, h('summary', {}, `Exact launch on ${(sec.linkLabel || sec.link).split(':')[0]}: command lines, environment, viewer URL`), h('pre', { class: 'cmd' }, launchText)) : null);
  });
}

let cur = 0;
function render() {
  const sec = D.sections[cur] && view(D.sections[cur]), main = $('#main');
  main.replaceChildren();
  if (!sec) { main.append(h('p', { class: 'empty' }, 'No results.')); return; }
  if (!sec.cols.length) { main.append(h('p', { class: 'empty' }, 'None of the shown stacks ran in this section. Pick others above.')); return; }
  const capped = sec.fps > 60 ? ` The viewer (Chromium, no GPU) presents at most 60 frames/s for every stack, so frames shown cap at 60 here; latency, CPU and bandwidth reflect the ${sec.fps} fps source.` : '';
  const fb = flagBox(sec);
  if (sec.cost && sec.cost.length) main.append(card('Cost of the session', `What the whole walkthrough cost each stack, ${sec.linkLabel || sec.link}: the same desktop, the same input and the same phases for every stack. Read the speed results below against these. Click a row’s name for what it measures.`, table(sec, sec.cost, false)));
  if (sec.headline.length) main.append(card('At a glance', `${sec.linkLabel || sec.link} · ${sec.mode}. Medians over ${sec.reps} rep${sec.reps > 1 ? 's' : ''}, in four groups of equal weight; under each motion result, the bandwidth that phase used. The best value among the shown stacks in each row gets a trophy where better has a direction (↑ higher, ↓ lower), and so does any value within noise of it (one step of the shown precision, or 1 % except for SSIM). Click a row’s name for what it measures.${capped}`, fb, table(sec, sec.headline, false)));
  for (const c of [
    chartCard('Bandwidth used in each phase', 'For every moving phase: how much bandwidth each stack used, and what it got for it.', () => tradeoff(sec)),
    chartCard('The session, start to finish', 'One continuous desktop session per stack: a window dragged all over the screen and let go, typing, a near-full-screen page scrolled at three column widths, window switching and maximising, wheel scrolling, ever larger animations, a blinking caret, then stillness.', () => timeline(sec)),
    chartCard('Animating more of the screen', 'Only the animated part should pay for the motion: frame rate should hold and the rest of the screen should stay sharp.', () => scaling(sec)),
    chartCard('Quality once settled', 'Motion should be smooth; once it stops the picture should be crisp, because that is when people read.', () => quality(sec)),
    chartCard('Sharpening after motion stops', 'How fast and how far each stack’s picture recovers after a stop.', () => curves(sec))]) if (c) main.append(c);
  const g = gallery(sec);
  if (g) main.append(card('Screenshots', null, g));
  main.append(card('All metrics', null, h('details', {}, h('summary', {}, `${sec.all.length} rows`), table(sec, sec.all, true))));
  const cfg = configuration(sec);
  if (cfg) main.append(card('Configuration under test', h('span', {}, `Each stack’s version and every setting the harness gives it at ${sec.mode}, with the stack’s shipped value where known and why it was chosen. To propose a change, give the override (hover a setting for its name), for example `, h('code', {}, 'set.voxl.crf=22'), ' or ', h('code', {}, 'set.neko.x264:qp-min=10'), '. A retest of the same binary needs no code change.'), cfg));
  if (D.problems.length) main.append(card('Problems', null, h('ul', { class: 'problems' }, D.problems.map((p) => h('li', {}, p)))));
}
if (D.preview) $('#preview').append(card('What the test does', 'The walkthrough every stack goes through, recorded on the X server itself before anything is measured. This is the desktop as the stacks are fed it, not any stack’s stream.',
  h('video', { class: 'walk', src: D.preview, controls: '', muted: '', loop: '', playsinline: '', preload: 'metadata' })));
const secTitle = (sec) => { const [t, ...rest] = String(sec.linkLabel || sec.link).split(': '); return { t, d: rest.join(': ') || (sec.link === 'lan' ? 'unshaped loopback' : '') }; };
function setSection(i) {
  cur = i;
  $('#sections').querySelectorAll('.net').forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
  render();
}
if (D.sections.length > 1) {
  const box = $('#sections');
  box.className = 'netbox';
  box.append(h('div', { class: 'nethint' }, h('b', {}, 'Network'), ' · switches every chart, table and screenshot below'),
    h('div', { class: 'netswitch', style: `--n:${Math.min(D.sections.length, 4)}` }, D.sections.map((sec, i) => { const x = secTitle(sec);
      return h('button', { class: 'net', type: 'button', 'aria-pressed': String(i === cur), onclick: () => setSection(i) },
        h('span', { class: 't' }, x.t), h('span', { class: 'd' }, [x.d, sec.mode].filter(Boolean).join(' · '))); })));
}
drawFilter();
render();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { render(); drawZoom(); }, 150); });
})();
</script>
</body>
</html>
